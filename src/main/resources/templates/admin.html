<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">
    <title>Admin panel</title>
    <script src="/js/Main.js" defer></script>
</head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
<body>
<div class="row text-white bg-dark">
    <div class="col d-flex justify-content-between align-items-center">
        <div sec:authorize="isFullyAuthenticated()">
            <h4 style="margin-left: 30px;"><b><span id="email_aut_admin"></span></b>  with roles <span
                    id="role_auth_admin"></span> </h4>
        </div>
        <div class="col-1 ml-auto">
            <div sec:authorize="isAuthenticated()">
                <a class="nav-link text-white" href="/logout">Logout</a>
            </div>
        </div>
    </div>
</div>
<div class="container-fluid">
    <div class="row" style="height: 100vh;">
        <div class="col-2">
            <ul class="nav flex-column">
                <li class="nav-item bg-primary mt-2">
                    <a class="nav-link text-white" th:href="@{/admin}" id="btnAdminPanel">Admin</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user}">User</a>
                </li>
            </ul>
        </div>
        <div class="col-10 bg-light">
            <h1><b>Admin panel</b></h1>
            <ul class="nav nav-tabs" role="tablist">
                <li class="active"><a class="btn btn-light" data-toggle="tab" href="#nav-home">All users</a></li>
                <li><a class="btn btn-light" data-toggle="tab" id="SliderNewUserForm" href="#nav-profile">New user</a></li>
            </ul>
            <div class="tab-content" id="nav-tabContent">
                <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab">
                    <div class="col bg-white"><h3>All users</h3></div>
                    <div class="col p-3" style="background-color: white;">
                        <table class="table table-striped" id="mainTableWithUsers">
                            <thead>
                            <th>Id</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Password</th>
                            <th>Role</th>
                            <th>Edit</th>
                            <th>Delete</th>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="tab-pane fade" id="nav-profile" role="tabpanel" aria-labelledby="nav-profile-tab">
                    <div class="col bg-white"><h3>Add new user</h3></div>
                    <div class="col bg-white text-center">
                        <form class="col-6 mx-auto" id="addNewUserForm">
                            <div class="form-group row">
                                <label class="col col-form-label" for="AddNewUsername">User name</label>
                                <input class="form-control-plaintext border" type="text"  id="AddNewUsername" placeholder="Username" />
                            </div>
                            <div class="form-group row">
                                <label class="col col-form-label" for="AddNewUserEmail">Email</label>
                                <input class="form-control-plaintext border" type="text" id="AddNewUserEmail" placeholder="Email" />
                            </div>
                            <div class="form-group row">
                                <label class="col col-form-label" for="AddNewUserPassword">Password</label>
                                <input class="form-control" type="password" id="AddNewUserPassword" placeholder="Password" />
                            </div>
                            <h5 class="text-center h5">ROLE_USER</h5>
                            <button class="btn btn-success" id="addNewUserButton" type="submit">Add new user</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--скрытое дефолтное модальное окно -->
<div class="modal fade" id="someDefaultModal" tabindex="-1" role="dialog" aria-labelledby="someDefaultModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
            </div>

            <div class="modal-footer">
            </div>

        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
</body>

</html>
